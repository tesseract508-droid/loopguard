[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopguard-core"
version = "0.1.0"
description = "High-performance 4D mathematical engine for intercepting AI agent loops."
readme = ""
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["loopguard*"]
